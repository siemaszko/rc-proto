<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RC Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f4f2; --surface-1: #fcfcfb; --line: #e4e3df; --grid: #ecebe7;
      --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
      --series-1: #2a78d6; --badge: #eda100;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --bg: #111110; --surface-1: #1a1a19; --line: #2c2c2a; --grid: #252523;
        --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
        --series-1: #3987e5; --badge: #c98500;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111110; --surface-1: #1a1a19; --line: #2c2c2a; --grid: #252523;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --series-1: #3987e5; --badge: #c98500;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text-primary); font: 15px/1.4 system-ui, sans-serif; }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 22px; }
    .meta { color: var(--text-muted); font-size: 13px; }
    .badge { border: 1px solid var(--badge); color: var(--text-secondary); border-radius: 4px; padding: 1px 6px; font-size: 12px; margin-left: 8px; vertical-align: 2px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
    .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .card h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
    .value { font-size: 30px; font-weight: 600; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
    .desc { color: var(--text-muted); font-size: 12px; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; margin-top: 12px; }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: 220px; margin-top: 12px; overflow: visible; touch-action: none; }
    .axis { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .gridline { stroke: var(--grid); }
    .tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .12); white-space: nowrap; }
    .tip b { display: block; font-variant-numeric: tabular-nums; }
    details { margin-top: 10px; font-size: 13px; color: var(--text-secondary); }
    table { border-collapse: collapse; width: 100%; margin-top: 6px; font-variant-numeric: tabular-nums; }
    td, th { padding: 3px 6px; border-bottom: 1px solid var(--grid); text-align: right; }
    td:first-child, th:first-child { text-align: left; }
    .error { color: #e34948; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Overview<span class="badge">fake data</span></h1>
    <span class="meta" id="meta">Loading…</span>
  </header>
  <section class="grid" id="tiles"></section>
  <section class="charts">
    <article class="card chart" id="mrr-chart"><h2>MRR · end of month</h2></article>
    <article class="card chart" id="revenue-chart"><h2>Revenue · per month</h2></article>
  </section>
</main>
<script>
  const SVG = "http://www.w3.org/2000/svg";
  const money = (v, digits = 0) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: digits }).format(v);
  const compact = (v) => "$" + new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(v);
  const monthLabel = (m) => new Date(m + "-01T00:00:00").toLocaleDateString("en-US", { month: "short" });
  const monthLong = (m) => new Date(m + "-01T00:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" });

  function el(tag, attrs = {}, parent) {
    const node = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    parent?.appendChild(node);
    return node;
  }

  function niceMax(v) {
    const step = Math.pow(10, Math.floor(Math.log10(v || 1)));
    return Math.ceil(v / step) * step;
  }

  // One series per chart: line (crosshair) or bars (per-mark hover), shared axes.
  function chart(container, rows, key, kind) {
    container.querySelectorAll("svg, .tip, details").forEach((n) => n.remove());
    const svg = el("svg", { role: "img", "aria-label": container.querySelector("h2").textContent });
    container.appendChild(svg);
    const W = svg.clientWidth, H = 220, L = 44, R = 8, T = 8, B = 22;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const max = niceMax(Math.max(...rows.map((r) => r[key])));
    const x = (i) => L + (kind === "bar" ? (i + 0.5) * (W - L - R) / rows.length : i * (W - L - R) / (rows.length - 1));
    const y = (v) => T + (H - T - B) * (1 - v / max);

    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i;
      el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "gridline" }, svg);
      el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "axis" }, svg).textContent = compact(v);
    }
    rows.forEach((r, i) => {
      if (W < 480 && i % 2 === rows.length % 2) return;
      el("text", { x: x(i), y: H - 6, "text-anchor": "middle", class: "axis" }, svg).textContent = monthLabel(r.month);
    });

    const marks = [];
    if (kind === "line") {
      el("path", { d: rows.map((r, i) => `${i ? "L" : "M"}${x(i)},${y(r[key])}`).join(""), fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    } else {
      const bw = Math.max(4, (W - L - R) / rows.length - 6);
      rows.forEach((r, i) => {
        const top = y(r[key]), h = y(0) - top, rx = Math.min(4, h);
        marks.push(el("path", { d: `M${x(i) - bw / 2},${y(0)}V${top + rx}q0,-${rx} ${rx},-${rx}h${bw - 2 * rx}q${rx},0 ${rx},${rx}V${y(0)}Z`, fill: "var(--series-1)" }, svg));
      });
    }
    const hair = el("line", { y1: T, y2: H - B, stroke: "var(--text-muted)", "stroke-width": 1, visibility: "hidden" }, svg);
    const dot = el("circle", { r: 4, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }, svg);

    const tip = document.createElement("div");
    tip.className = "tip"; tip.hidden = true;
    container.appendChild(tip);

    svg.addEventListener("pointermove", (e) => {
      const box = svg.getBoundingClientRect();
      const px = e.clientX - box.left;
      let i = 0;
      rows.forEach((_, j) => { if (Math.abs(x(j) - px) < Math.abs(x(i) - px)) i = j; });
      const r = rows[i];
      if (kind === "line") {
        hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
        dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(r[key])); dot.setAttribute("visibility", "visible");
      } else {
        marks.forEach((m, j) => m.setAttribute("opacity", j === i ? 1 : 0.55));
      }
      tip.replaceChildren();
      const v = document.createElement("b"); v.textContent = money(r[key]);
      tip.append(monthLong(r.month), v);
      tip.hidden = false;
      const cx = x(i) + svg.offsetLeft, cy = y(r[key]) + svg.offsetTop;
      tip.style.left = Math.min(cx + 10, container.clientWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = Math.max(cy - tip.offsetHeight - 8, 8) + "px";
    });
    svg.addEventListener("pointerleave", () => {
      tip.hidden = true;
      hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden");
      marks.forEach((m) => m.setAttribute("opacity", 1));
    });

    const details = document.createElement("details");
    details.innerHTML = "<summary>Show table</summary><table><thead><tr><th>Month</th><th>Value</th></tr></thead><tbody></tbody></table>";
    const tbody = details.querySelector("tbody");
    rows.forEach((r) => {
      const tr = tbody.insertRow();
      tr.insertCell().textContent = monthLong(r.month);
      tr.insertCell().textContent = money(r[key]);
    });
    container.appendChild(details);
  }

  let last;
  function render() {
    if (!last) return;
    chart(document.getElementById("mrr-chart"), last.series, "mrr", "line");
    chart(document.getElementById("revenue-chart"), last.series, "revenue", "bar");
  }
  addEventListener("resize", render);

  async function load() {
    const meta = document.getElementById("meta");
    try {
      const res = await fetch("/api/overview");
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const data = await res.json();
      const tiles = document.getElementById("tiles");
      tiles.replaceChildren(...data.metrics.map((m) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = '<h2></h2><div class="value"></div><div class="desc"></div>';
        card.querySelector("h2").textContent = m.name;
        card.querySelector(".value").textContent = m.unit === "$" ? money(m.value) : new Intl.NumberFormat("en-US").format(m.value);
        card.querySelector(".desc").textContent = m.description;
        return card;
      }));
      last = data;
      render();
      meta.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      meta.innerHTML = '<span class="error"></span>';
      meta.firstChild.textContent = `Error: ${err.message}`;
    }
  }
  load();
</script>
</body>
</html>
